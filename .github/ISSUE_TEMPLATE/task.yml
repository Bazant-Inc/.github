name: Engineering Issue
description: Create a new Task
title: "[T]: "
labels: []
assignees: []

body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      description: What type of issue is this?
      options:
        - 📋 Task
        - ✨ Feature
        - 🔎 Research
        - 🐛 Bug
    validations:
      required: true

  - type: dropdown
    id: service_type
    attributes:
      label: Service
      description: What service is it related to?
      options:
        - Frontend
        - Backend
        - Configuration service
        - Automation service
        - Job scheduler service
        - Orchestrator
        - Agent
        - Task runner
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the issue.
      placeholder: e.g. Add authentication system using OAuth2
    validations:
      required: true

  - type: textarea
    id: tech_details
    attributes:
      label: Details
      description: Provide background, technical details, or reasoning.
      placeholder: Include error messages, screenshots, diagrams, or relevant specs.
    validations:
      required: false

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: Check all that must be completed before closing the issue.
      options:
        - label: "✅ Implementation"
        - label: "📖 Documentation"
        - label: "📝 Instruction / Usage Guide"

  - type: input
    id: priority
    attributes:
      label: Priority
      description: Optional – set urgency (Low, Medium, High, Critical)
      placeholder: e.g. High
    validations:
      required: false

  - type: input
    id: due_date
    attributes:
      label: Due Date
      description: If applicable, provide a target deadline.
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ⚡ **Tip:** Assign labels (bug, feature, task, priority) and link this issue to a milestone or project board for better tracking.
